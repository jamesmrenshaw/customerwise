{% extends "base.html" %}

{% block content %}
  <div>
    <h1>Customer Wise</h1>
    <p class="lead">The shopper workspace pilot is being built. Sign-in comes next.</p>
  </div>
  <div class="card">
    <p>Status tags use the Customer Wise palette:</p>
    <p>
      <span class="tag tag--none">Not started</span>
      <span class="tag tag--active">Initial contact</span>
      <span class="tag tag--warn">Returned</span>
      <span class="tag tag--done">Complete</span>
      <span class="tag tag--shopper">Added by shopper</span>
    </p>
  </div>
{% endblock %}
