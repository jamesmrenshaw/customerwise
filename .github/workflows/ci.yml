name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: customerwise
          POSTGRES_PASSWORD: customerwise
          POSTGRES_DB: customerwise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U customerwise"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://customerwise:customerwise@localhost:5432/customerwise
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: System libraries for PDF export (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Tests
        run: uv run pytest
      - name: Static files build as in the Docker image
        # The manifest storage fails on references to missing files (e.g. source maps).
        run: uv run python manage.py collectstatic --noinput --clear
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-build-only
          DJANGO_ALLOWED_HOSTS: example.up.railway.app
      - name: Production settings pass the deployment checklist
        run: |
          export DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')"
          uv run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ALLOWED_HOSTS: example.up.railway.app
          DEFAULT_FROM_EMAIL: ci@example.com
          BREVO_API_KEY: ci-placeholder
